name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (flake8 + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint tools
        run: pip install black flake8
      - name: black --check
        run: black --check clipsai tests
      - name: flake8
        run: flake8 clipsai tests

  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libmagic1

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          # whisperx is not on PyPI; skip it in CI unless a test needs it
          # pip install "whisperx @ git+https://github.com/m-bain/whisperx.git@v3.1.1"

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          # Tests that require real model downloads are skipped unless the token is set.
          HF_AUTH_TOKEN: ${{ secrets.HF_AUTH_TOKEN }}
